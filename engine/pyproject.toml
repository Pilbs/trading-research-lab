[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-research-lab"
version = "0.1.0"
description = "Research engine for market hypothesis discovery and validation."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trading_research_lab*"]